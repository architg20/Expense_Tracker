<style>
/* General Styles */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

#user-profile {
  display: flex;
  justify-content: flex-end;
  padding: 10px;
  background-color: #333;
  color: #fff;
}

#username-btn {
  background-color: #555;
  border: none;
  color: #fff;
  padding: 10px;
  cursor: pointer;
  font-size: 16px;
}

#dropdown {
  display: none;
  position: absolute;
  background-color: #fff;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
  min-width: 160px;
  right: 10px;
}

#dropdown button {
  background-color: #fff;
  color: #333;
  border: none;
  padding: 10px;
  text-align: left;
  width: 100%;
  cursor: pointer;
}

#dropdown button:hover {
  background-color: #ddd;
}

#expense-form {
  background-color: #fff;
  padding: 20px;
  margin: 20px auto;
  border-radius: 8px;
  max-width: 500px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

#expense-form input, #expense-form select, #expense-form button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 5px;
}

#expense-form button {
  background-color: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
}

#expense-form button:hover {
  background-color: #45a049;
}

#expense-list {
  list-style-type: none;
  padding: 0;
  margin: 20px auto;
  max-width: 500px;
}

#expense-list li {
  background-color: #fff;
  padding: 10px;
  margin: 10px 0;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  display: flex;
  justify-content: space-between;
}

#expense-list button {
  background-color: #f44336;
  color: white;
  border: none;
  padding: 5px 10px;
  cursor: pointer;
}

#expense-list button:hover {
  background-color: #e53935;
}

#dropdown button:disabled {
  background-color: #888 !important;
  color: white;
  cursor: default;
}
</style>

<!-- User Profile and Logout Button -->
<div id="user-profile">
  <button id="username-btn">Hi, <span id="username">Username</span></button>
  <div id="dropdown" style="display: none;">
    <button id="logout-btn">Logout</button>
    <button id="buy-premium-btn">Buy Premium</button>
  </div>
</div>

<form id="expense-form">
  <input type="number" id="amount" placeholder="Amount" required />
  <input type="text" id="description" placeholder="Description" required />
  <select id="category" required>
    <option value="">Select Category</option>
    <option value="Food">Food</option>
    <option value="Fuel">Fuel</option>
    <option value="Travel">Travel</option>
    <option value="Entertainment">Entertainment</option>
  </select>
  <button type="submit">Add Expense</button>
</form>

<ul id="expense-list"></ul>

<div style="text-align: center; margin-top: 10px;">
  <label for="items-per-page">Expenses per page:</label>
  <select id="items-per-page">
    <option value="5">5</option>
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="40">40</option>
  </select>
</div>



<div id="pagination" style="text-align: center; margin-top: 20px; display: none;">
  <button id="prev-btn">Previous</button>
  <span id="page-info">Page 1</span>
  <button id="next-btn">Next</button>
</div>

<button id="view-reports-btn" style="display: none; background-color: #6a5acd; color: white; padding: 10px 15px; border: none; border-radius: 5px;">
  📊 View Reports
</button>




<div style="text-align: center; margin: 20px;">
  <button id="leaderboard-btn" style="display: none; background-color: #007BFF; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">
    Show Leaderboard
  </button>
</div>


<div id="leaderboard-section" style="display: none; max-width: 500px; margin: auto;">
  <h2>🏆 Leaderboard</h2>
  <ul id="leaderboard-list" style="list-style: none; padding: 0;"></ul>
</div>


<script>

  


  const token = localStorage.getItem('token'); 
  console.log(token);
  if (!token) {

    window.location.href = 'login.html';
  }

  // Decode token and set username
  const decodedToken = JSON.parse(atob(token.split('.')[1])); // Decode JWT
  const username = decodedToken.username;  
  const isPremiumUser = decodedToken.premium;
  document.getElementById('username').textContent = username;
  if (isPremiumUser) {
  document.getElementById('leaderboard-btn').style.display = 'inline-block';
  document.getElementById('view-reports-btn').style.display = 'inline-block';
  }


  const isPremium = decodedToken.premium;
  const buyBtn = document.getElementById('buy-premium-btn');

  document.getElementById('view-reports-btn').addEventListener('click', () => {
  window.location.href = `report.html?token=${encodeURIComponent(token)}`;
});

if (isPremium) {
  buyBtn.disabled = true;
  buyBtn.textContent = "You are a Premium User ⭐";
  buyBtn.style.backgroundColor = "#888";
  buyBtn.style.cursor = "default";
}


  document.getElementById('expense-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const amount = document.getElementById('amount').value;
    const description = document.getElementById('description').value;
    const category = document.getElementById('category').value;

    const response = await fetch('/expense/add', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`  
      },
      body: JSON.stringify({ amount, description, category })
    });

    const data = await response.json();
    console.log(data);
    if (data.success) {
      alert('Expense added');
      fetchAllExpenses(); // reload list
    } else {
      alert('Failed to add');
    }
  });


  document.getElementById('leaderboard-btn').addEventListener('click', async () => {
  try {
    const response = await fetch('/premium/showleaderboard', {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });

    const data = await response.json();
    const leaderboard = data.leaderboard;

    const list = document.getElementById('leaderboard-list');
    list.innerHTML = '';

    leaderboard.forEach((user, index) => {
      const li = document.createElement('li');
      li.textContent = `${index + 1}. ${user.username} - Total Expenses ₹${user.totalExpense}`;
      list.appendChild(li);
    });

    document.getElementById('leaderboard-section').style.display = 'block';
  } catch (err) {
    console.error("Error loading leaderboard:", err);
    alert("Could not load leaderboard.");
  }
  });

  

 let currentPage = 1;
 let limit = parseInt(localStorage.getItem('expensesPerPage')) || 10;
 let allExpenses = [];


document.getElementById('items-per-page').value = limit;


document.getElementById('items-per-page').addEventListener('change', () => {
  limit = parseInt(document.getElementById('items-per-page').value);
  localStorage.setItem('expensesPerPage', limit);
  currentPage = 1; 
  renderExpenses(currentPage); 
});

async function fetchAllExpenses() {
  const response = await fetch('/expense/get', {
    headers: { 'Authorization': `Bearer ${token}` }
  });

  const data = await response.json();


  if (!data.success || !Array.isArray(data.expenses)){
    console.error("No Array but got :", data);
    if (data.message === 'Token has expired') {
      alert("Token expired.");
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    } else {
      alert("Failed to fetch expenses.");
    }
    return;
  }

  allExpenses = data.expenses;
  renderExpenses(currentPage);
}

 function renderExpenses(page = 1) {
  const list = document.getElementById('expense-list');
  list.innerHTML = '';

  const start = (page - 1) * limit;
  const end = start + limit;
  const expensesToShow = allExpenses.slice(start, end);

  if (expensesToShow.length === 0) {
    list.innerHTML = '<li>No expenses found.</li>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  expensesToShow.forEach(exp => {
    const li = document.createElement('li');
    li.innerHTML = `${exp.amount} - ${exp.description} (${exp.category}) 
      <button onclick="deleteExpense(${exp.id})">Delete</button>`;
    list.appendChild(li);
  });

  const totalPages = Math.ceil(allExpenses.length / limit);
  currentPage = page;
  document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
  document.getElementById('pagination').style.display = 'block';
  document.getElementById('prev-btn').disabled = currentPage <= 1;
  document.getElementById('next-btn').disabled = currentPage >= totalPages;
}

  

  function filterExpenses(type) {
  loadExpenses(type);
   }


function downloadCSV(expenses) {
  const now = new Date();
  const currentDate = now.toLocaleDateString();
  const currentTime = now.toLocaleTimeString();
  const year = now.getFullYear();
  const monthYear = now.toLocaleString('default', { month: 'long', year: 'numeric' });

  let csv = `Day-to-Day Expenses\n`;
  csv += `Date: ${currentDate}\n`;
  csv += `Time: ${currentTime}\n`;
  csv += `Year: ${year}\n`;
  csv += `Month & Year: ${monthYear}\n\n`;

  csv += `Date,Description,Category,Income,Expense\n`;

  let totalExpense = 0;
  let totalIncome = 0;

  expenses.forEach(exp => {
    const date = new Date(exp.createdAt).toLocaleDateString();
    const isIncome = exp.type === 'income'; // assume backend gives "type"
    const income = isIncome ? exp.amount : '';
    const expense = !isIncome ? exp.amount : '';
    if (isIncome) totalIncome += Number(exp.amount);
    else totalExpense += Number(exp.amount);

    csv += `${date},"${exp.description}",${exp.category},${income},${expense}\n`;
  });

  const savings = totalIncome - totalExpense;

  csv += `\nTotal Expenditure:,₹${totalExpense.toFixed(2)}\n`;
  csv += `Savings:,₹${savings.toFixed(2)}\n`;

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'DayToDay_Expense_Report.csv';
  a.click();
  window.URL.revokeObjectURL(url);
  }



  async function deleteExpense(id) {
    await fetch(`/expense/delete/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }  // Include JWT token in header
    });
    fetchAllExpenses();
  }

  // Logout functionality
  document.getElementById('logout-btn').addEventListener('click', () => {
    // Clear token from localStorage
    localStorage.removeItem('token');
  
    // Redirect to login page
    window.location.href = 'login.html';
  });

  // Toggle dropdown visibility
  document.getElementById('username-btn').addEventListener('click', () => {
    const dropdown = document.getElementById('dropdown');
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
  });

  // Load expenses on page load
  fetchAllExpenses();
  document.getElementById('prev-btn').addEventListener('click', () => {
  if (currentPage > 1) {
    renderExpenses(currentPage - 1);
  }
});

document.getElementById('next-btn').addEventListener('click', () => {
  renderExpenses(currentPage + 1);
});


</script>

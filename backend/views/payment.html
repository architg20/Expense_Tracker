<!DOCTYPE html>

    body {

    }

    h1 {
      color: #333;
    }

    .card {
      width: 600px;
      padding: 20px;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #5cb85c;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

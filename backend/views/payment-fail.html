<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Failed</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff5f5;
      text-align: center;
      padding: 50px;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background-color: #ffe6e6;
      padding: 30px;
      border-radius: 10px;
      border: 1px solid #ffcccc;
    }
    h1 {
      color: #d8000c;
    }
    p {
      color: #555;
    }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #d8000c;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    a.button:hover {
      background-color: #a30000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Payment Failed</h1>
    <p>Oops! Something went wrong and your payment could not be completed.</p>
    <a href="/expense" class="button">Go Back to Dashboard</a>
  </div>
</body>
</html>
